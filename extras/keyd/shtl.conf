# shtl: hold Space to open the panel. Optional (Settings → Behavior → Open shtl with). Install:
#   sudo cp extras/keyd/shtl.conf /etc/keyd/shtl.conf && sudo systemctl restart keyd
# Tap Space = space. Hold Space >= 170 ms (and not mid-word) = the "shtl" layer.
# `keyd listen` prints +shtl / -shtl, which is the panel's open / release signal.
# Panic exit if anything goes wrong: Backspace + Escape + Enter.

[ids]
*

[main]
# Struck within 150 ms of typing -> always a space (fast-typing rollover).
# Otherwise: held 170 ms, or another key tapped while held -> the shtl layer.
space = lettermod(shtl, space, 150, 170)

# Ctrl+Alt+Shift while held, so keys pressed during a hold reach Hyprland as shtl binds
# even before the listener has reported the hold (no race).
[shtl:C-A-S]
